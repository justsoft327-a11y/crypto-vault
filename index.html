<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Vault</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 class="logo">crypto vault</h1>
            <div class="header-icons">
                <i class="fa-solid fa-search" id="search-btn"></i>
                <i class="fa-solid fa-eye" id="blur-eye-btn" title="Tap 3 times for Admin"></i>
                <i class="fa-solid fa-bell" id="notification-btn"></i>
            </div>
        </header>

        <!-- Main Views Container -->
        <main class="main-content">
            <!-- Home View -->
            <div id="home-view" class="view-content active">
                <div class="profile-summary">
                    <div class="avatar-container" id="open-settings">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=cryptovault" alt="Avatar" id="user-avatar">
                    </div>
                </div>

                <div class="balance-card">
                    <p class="balance-title">Total Cash Balance</p>
                    <h2 id="total-cash-display">$20,000.00</h2>
                </div>

                <div class="action-buttons">
                    <button class="action-btn" id="deposit-btn">
                        <i class="fa-solid fa-arrow-down"></i>
                        <span>Deposit</span>
                    </button>
                    <button class="action-btn" id="withdraw-btn">
                        <i class="fa-solid fa-arrow-up"></i>
                        <span>Withdraw</span>
                    </button>
                    <button class="action-btn" id="convert-btn">
                        <i class="fa-solid fa-rotate"></i>
                        <span>Convert</span>
                    </button>
                </div>
            </div>

            <!-- Crypto View -->
            <div id="crypto-view" class="view-content">
                <div class="crypto-card">
                    <h3>My Bitcoin Wallet</h3>
                    <p id="btc-held-display">0.000000 BTC</p>
                    <p id="btc-usd-display">($0.00)</p>
                </div>
                <div class="action-buttons">
                    <button class="action-btn" id="buy-btc-btn">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Buy BTC</span>
                    </button>
                    <button class="action-btn" id="receive-btn">
                        <i class="fa-solid fa-arrow-down"></i>
                        <span>Receive</span>
                    </button>
                    <button class="action-btn" id="send-btn">
                        <i class="fa-solid fa-arrow-up"></i>
                        <span>Send</span>
                    </button>
                </div>
            </div>

            <!-- Pay Bill View -->
            <div id="paybill-view" class="view-content">
                <h2>Pay Bills</h2>
                <p>Utility and service payments coming soon.</p>
            </div>

            <!-- Cards View -->
            <div id="cards-view" class="view-content">
                <div class="virtual-card">
                    <span class="card-type">Virtual</span>
                    <div class="card-holder-name" id="card-holder-display">YOUR NAME</div>
                    <div class="card-balance">Balance: <span id="card-balance-display">$20,000.00</span></div>
                </div>
            </div>
        </main>

        <!-- Settings Modal / Overlay -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Settings & Profile</h3>
                    <i class="fa-solid fa-xmark" id="close-settings"></i>
                </div>
                <div class="profile-edit-section">
                    <input type="text" id="username-input" placeholder="Enter your name">
                </div>
                <div class="settings-list">
                    <div class="setting-item" id="set-account">
                        <span>Account Settings</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                    <div class="setting-item" id="set-recipients">
                        <span>Recipients</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                    <div class="setting-item" id="set-security">
                        <span>Security & 2FA Authentication</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                    <div class="setting-item" id="set-preferences">
                        <span>Preferences</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                    <div class="setting-item" id="set-about">
                        <span>About Us</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>
                <button class="logout-btn" id="logout-btn">Log Out</button>
            </div>
        </div>

        <!-- Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-target="home-view">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" data-target="crypto-view">
                <i class="fa-solid fa-coins"></i>
                <span>Crypto</span>
            </button>
            <button class="nav-item" data-target="paybill-view">
                <i class="fa-solid fa-lightbulb"></i>
                <span>Pay Bill</span>
            </button>
            <button class="nav-item" data-target="cards-view">
                <i class="fa-solid fa-credit-card"></i>
                <span>Cards</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
