<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Vault</title>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 16px; padding-bottom: 80px; }
        .page-section { display: block; }
        .balance-container { text-align: center; margin: 24px 0; }
        .balance-title { font-size: 13px; color: #8c96a5; margin-bottom: 6px; }
        .balance-amount { font-size: 32px; font-weight: 700; color: #ffffff; }
        .action-buttons { display: flex; justify-content: center; gap: 20px; margin-bottom: 24px; }
        .action-btn-item { background: none; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .action-circle { width: 48px; height: 48px; background-color: #161b22; border: 1px solid #30363d; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 6px; }
        .action-label { font-size: 12px; color: #8c96a5; }
        .card-box { background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .asset-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #21262d; }
        .asset-row:last-child { border-bottom: none; }
        .asset-left { display: flex; align-items: center; gap: 12px; }
        .crypto-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }
        .btc-bg { background-color: #f7931a; }
        .usdt-bg { background-color: #26a17b; }
        .asset-name { font-size: 14px; font-weight: 600; color: #fff; }
        .asset-sub { font-size: 12px; color: #8c96a5; }
        .asset-right { text-align: right; }
        .sparkline { width: 60px; height: 24px; }
        .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #21262d; font-size: 13px; }
        .tx-item:last-child { border-bottom: none; }
        .tx-title { font-weight: 600; color: #fff; }
        .tx-time { font-size: 11px; color: #8c96a5; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; box-sizing: border-box; }
        .modal-content { background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; width: 100%; max-width: 340px; padding: 20px; box-sizing: border-box; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .modal-close { background: none; border: none; color: #8c96a5; font-size: 20px; cursor: pointer; }
        .primary-btn { width: 100%; background-color: #238636; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .secondary-btn { width: 100%; background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 8px; padding: 10px; font-weight: 600; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <!-- CRYPTO PAGE -->
    <div id='page-crypto' class='page-section'>
        <div class='balance-container'>
            <div class='balance-title'>Total Crypto Balance</div>
            <div class='balance-amount' id='crypto-total-display'>$0.00</div>
        </div>
        <div class='action-buttons'>
            <button class='action-btn-item' id='buy-crypto-btn'><div class='action-circle'>🛒</div><span class='action-label'>Buy</span></button>
            <button class='action-btn-item' id='receive-btn'><div class='action-circle'>⬇</div><span class='action-label'>Receive</span></button>
            <button class='action-btn-item' id='send-btn'><div class='action-circle'>⬆</div><span class='action-label'>Send</span></button>
        </div>
        <div class='card-box'>
            <div style='font-size: 13px; color: #8c96a5; margin-bottom: 10px;'>My Cryptocurrencies (24h Trend)</div>
            <div class='asset-row' id='btc-row'>
                <div class='asset-left'>
                    <div class='crypto-icon btc-bg'>₿</div>
                    <div><div class='asset-name'>Bitcoin</div><div class='asset-sub'>BTC</div></div>
                </div>
                <div>
                    <svg class='sparkline' viewBox='0 0 60 24'>
                        <path d='M 0 20 L 15 14 L 30 18 L 45 8 L 60 4' fill='none' stroke='#26a17b' stroke-width='2'/>
                    </svg>
                </div>
                <div class='asset-right'>
                    <div class='asset-name' id='btc-amount-held'>0.000000 BTC</div>
                    <div class='asset-sub' id='btc-usd-val'>$0.00</div>
                </div>
            </div>
            <div class='asset-row'>
                <div class='asset-left'>
                    <div class='crypto-icon usdt-bg'>₮</div>
                    <div><div class='asset-name'>Tether</div><div class='asset-sub'>USDT</div></div>
                </div>
                <div>
                    <svg class='sparkline' viewBox='0 0 60 24'>
                        <path d='M 0 12 L 15 13 L 30 11 L 45 13 L 60 12' fill='none' stroke='#3b82f6' stroke-width='2'/>
                    </svg>
                </div>
                <div class='asset-right'>
                    <div class='asset-name'>0.00 USDT</div>
                    <div class='asset-sub'>$0.00</div>
                </div>
            </div>
        </div>
        <div class='card-box'>
            <div style='font-size: 13px; color: #8c96a5; margin-bottom: 10px;'>Crypto Transaction History</div>
            <div id='crypto-transaction-feed'>
                <div class='tx-item'>
                    <div>
                        <div class='tx-title'>Wallet Initialized</div>
                        <div class='tx-time'>Today, 12:00 AM</div>
                    </div>
                    <div style='color: #8c96a5; font-weight: 600;'>0 BTC</div>
                </div>
            </div>
        </div>
    </div>
        <!-- RECEIVE MODAL -->
    <div class='modal-overlay' id='receive-modal'>
        <div class='modal-content'>
            <div class='modal-header'>
                <h3 style='font-size: 16px; margin: 0;'>Receive Bitcoin</h3>
                <button class='modal-close' id='receive-close-btn'>×</button>
            </div>
            <p style='color: #8c96a5; font-size: 13px; margin-bottom: 12px;'>Send only Bitcoin (BTC) to this address:</p>
            <div style='background-color: #0d1117; padding: 12px; border-radius: 8px; border: 1px solid #30363d; word-break: break-all; font-family: monospace; font-size: 13px; color: #fff; margin-bottom: 14px;' id='wallet-address-text'>
                bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
            </div>
            <button class='primary-btn' id='copy-address-btn' style='margin-bottom: 8px;'>Copy Wallet Address</button>
            <button class='secondary-btn' id='close-receive-secondary'>Close</button>
        </div>
    </div>

    <script>
        let currentBalance = 20000;
        let btcHeld = 0;

        function updateUI() {
            const btcVal = btcHeld * 65420;
            const totalDisplay = document.getElementById('crypto-total-display');
            if(totalDisplay) totalDisplay.innerText = '$' + btcVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            const btcAmountHeld = document.getElementById('btc-amount-held');
            if(btcAmountHeld) btcAmountHeld.innerText = btcHeld.toFixed(6) + ' BTC';

            const btcUsdVal = document.getElementById('btc-usd-val');
            if(btcUsdVal) btcUsdVal.innerText = '$' + btcVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function logCryptoTransaction(title, amountStr, isPositive) {
            const feed = document.getElementById('crypto-transaction-feed');
            if(!feed) return;
            const timeStr = 'Just now';
            const color = isPositive ? '#26a17b' : '#ff5c5c';
            const sign = isPositive ? '+' : '-';
            
            const newItem = document.createElement('div');
            newItem.className = 'tx-item';
            newItem.innerHTML = `
                <div>
                    <div class='tx-title'>${title}</div>
                    <div class='tx-time'>${timeStr}</div>
                </div>
                <div style='color: ${color}; font-weight: 600;'>${sign}${amountStr}</div>
            `;
            feed.prepend(newItem);
        }
                // Buy Bitcoin from Cash Balance
        document.getElementById('buy-crypto-btn').addEventListener('click', () => {
            const amountStr = prompt('Enter USD amount from your cash balance to buy Bitcoin:', '100');
            if(!amountStr) return;
            const usdSpend = Number(amountStr);
            if(usdSpend <= 0 || usdSpend > currentBalance) { alert('Invalid amount or insufficient cash balance.'); return; }
            currentBalance -= usdSpend;
            const btcBought = usdSpend / 65420;
            btcHeld += btcBought;
            updateUI();
            alert('Successfully purchased ' + btcBought.toFixed(6) + ' BTC!');
            logCryptoTransaction('Bought BTC', btcBought.toFixed(6) + ' BTC', true);
        });

        // Receive Modal Handlers
        document.getElementById('receive-btn').addEventListener('click', () => {
            document.getElementById('receive-modal').style.display = 'flex';
        });
        document.getElementById('receive-close-btn').addEventListener('click', () => {
            document.getElementById('receive-modal').style.display = 'none';
        });
        document.getElementById('close-receive-secondary').addEventListener('click', () => {
            document.getElementById('receive-modal').style.display = 'none';
        });
        document.getElementById('copy-address-btn').addEventListener('click', () => {
            const addr = document.getElementById('wallet-address-text').innerText.trim();
            navigator.clipboard.writeText(addr).then(() => {
                alert('Wallet address copied to clipboard!');
            }).catch(() => {
                alert('Address: ' + addr);
            });
        });

        // Send Crypto to Outer Wallet
        document.getElementById('send-btn').addEventListener('click', () => {
            const recipientAddr = prompt('Enter recipient Bitcoin wallet address:');
            if(!recipientAddr) return;
            const btcAmountStr = prompt('Enter BTC amount to send (You hold ' + btcHeld.toFixed(6) + ' BTC):');
            if(!btcAmountStr) return;
            const btcToSend = Number(btcAmountStr);
            if(btcToSend <= 0 || btcToSend > btcHeld) { alert('Invalid amount or insufficient BTC balance.'); return; }
            
            btcHeld -= btcToSend;
            updateUI();
            alert('Successfully sent ' + btcToSend.toFixed(6) + ' BTC to ' + recipientAddr.substring(0, 8) + '...');
            logCryptoTransaction('Sent BTC', btcToSend.toFixed(6) + ' BTC', false);
        });
    </script>
</body>
</html>
